apiVersion: apps/v1
kind: Deployment
metadata:
  name: self-Intruduction
spec:
  replicas: 2
  selector:
    matchLabels:
      app: self-Intruduction
  template:
    metadata:
      labels:
        app: self-Intruduction
    spec:
      containers:
        - name: self-Intruduction
          image: ghcr.io/woonkim0413/self-introduction:f6418049411c7a8944b7ade5f9b86ca8a1e1d6e2
          ports:
            - containerPort: 8080
