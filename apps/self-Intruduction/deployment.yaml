apiVersion: apps/v1
kind: Deployment
metadata:
  name: self-introduction
spec:
  replicas: 2
  selector:
    matchLabels:
      app: self-introduction
  template:
    metadata:
      labels:
        app: self-introduction
    spec:
      containers:
        - name: self-introduction
          image: ghcr.io/woonkim0413/self-intruduction:96012827cdbd1e58e2afe482178fa71a1540f443
          ports:
            - containerPort: 8080
