apiVersion: apps/v1
kind: Deployment
metadata:
  name: self-introduction
spec:
  replicas: 2
  selector:
    matchLabels:
      app: self-introduction
  template:
    metadata:
      labels:
        app: self-introduction
    spec:
      containers:
        - name: self-introduction
          image: ghcr.io/woonkim0413/self-introduction:99fe776ef7fc1e4dc4db586439b1ed129077e98c
          ports:
            - containerPort: 8080
