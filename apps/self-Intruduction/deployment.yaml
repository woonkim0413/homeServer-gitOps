apiVersion: apps/v1
kind: Deployment
metadata:
  name: self-Intruduction
spec:
  replicas: 2
  selector:
    matchLabels:
      app: self-Intruduction
  template:
    metadata:
      labels:
        app: self-Intruduction
    spec:
      containers:
        - name: self-Intruduction
          image: ghcr.io/woonkim0413/self-introduction:initial
          ports:
            - containerPort: 8080
