apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: self-introduction
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/woonkim0413/homelab-gitops.git
    targetRevision: main
    path: apps/self-Intruduction

  destination:
    server: https://kubernetes.default.svc
    namespace: self-Intruduction

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
