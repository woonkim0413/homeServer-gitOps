apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 42.3.1
    helm:
      values: |
        ingressClass:
          enabled: true
          isDefaultClass: false
          name: traefik
        providers:
          kubernetesIngress:
            enabled: true
            ingressClass: traefik
        service:
          spec:
            type: ClusterIP
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
